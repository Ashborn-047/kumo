<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 140" width="260" height="280" fill="none">
  <defs>
    <filter id="kubo_shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2E3B52" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Spring Antenna -->
  <rect x="62" y="14" width="6" height="24" rx="3" fill="#525F77" />
  <!-- Antenna Beacons -->
  <circle cx="65" cy="12" r="9" fill="#34D399" opacity="0.4" />
  <circle cx="65" cy="12" r="6" fill="#34D399" stroke="#FFFFFF" stroke-width="2" />

  <!-- Cube Chassis Body -->
  <rect x="15" y="36" width="100" height="88" rx="20" fill="#2E3B52" stroke="#474554" stroke-width="3" filter="url(#kubo_shadow)" />

  <!-- CRT Screen Bezel -->
  <rect x="25" y="46" width="80" height="52" rx="14" fill="#171B2B" stroke="#3A475F" stroke-width="2" />

  <!-- LED Pixel Face: Happy Caret Eyes (^_^) -->
  <rect x="38" y="62" width="16" height="16" rx="4" fill="#DCF5E7" />
  <path d="M42 72L46 66L50 72" stroke="#171B2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <rect x="76" y="62" width="16" height="16" rx="4" fill="#DCF5E7" />
  <path d="M80 72L84 66L88 72" stroke="#171B2B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Equalizer Mouth Bar -->
  <rect x="58" y="76" width="14" height="4" rx="2" fill="#34D399" />

  <!-- Hardware Buttons / Status Bar -->
  <circle cx="35" cy="110" r="4" fill="#818CF8" />
  <circle cx="47" cy="110" r="4" fill="#FB7185" />
  <text x="70" y="113" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#8A92A6" letter-spacing="1">KUBO-04</text>
</svg>
