<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Kumoboard - AI Spatial Workbench</title>

  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS & Stitch Design Theme Tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "surface-variant": "#dfe1f8",
            "on-primary-fixed-variant": "#402db4",
            "tertiary-container": "#b34533",
            "primary": "#4a3abe",
            "surface-container": "#ececff",
            "primary-container": "#6355d8",
            "outline": "#787585",
            "on-background": "#171b2b",
            "secondary-fixed": "#d6e3ff",
            "background": "#fbf8ff",
            "surface-container-lowest": "#ffffff",
            "error": "#ba1a1a",
            "surface-tint": "#5849cc",
            "inverse-surface": "#2c2f41",
            "surface-dim": "#d6d9ef",
            "error-container": "#ffdad6",
            "tertiary-fixed": "#ffdad4",
            "outline-variant": "#c8c4d6",
            "on-surface-variant": "#474554",
            "on-error": "#ffffff",
            "on-primary-container": "#ece7ff",
            "surface-container-high": "#e5e7fe",
            "on-surface": "#171b2b",
            "inverse-primary": "#c6bfff",
            "tertiary": "#922e1e",
            "secondary-fixed-dim": "#b9c7e3",
            "primary-fixed-dim": "#c6bfff",
            "primary-fixed": "#e4dfff",
            "on-tertiary": "#ffffff",
            "on-tertiary-fixed-variant": "#842415",
            "surface-container-highest": "#dfe1f8",
            "on-secondary": "#ffffff",
            "tertiary-fixed-dim": "#ffb4a6",
            "surface-container-low": "#f3f2ff",
            "on-tertiary-container": "#ffe3de",
            "on-error-container": "#93000a",
            "surface": "#fbf8ff",
            "secondary-container": "#d3e0fd",
            "inverse-on-surface": "#efefff",
            "secondary": "#525f77",
            "on-primary": "#ffffff",
            "on-primary-fixed": "#160066",
            "on-secondary-fixed-variant": "#3a475f",
            "on-secondary-fixed": "#0e1c31",
            "surface-bright": "#fbf8ff",
            "on-tertiary-fixed": "#3f0300",
            "on-secondary-container": "#56637c"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "gutter": "1.5rem",
            "space-xs": "0.25rem",
            "margin-mobile": "1rem",
            "margin": "2rem",
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "gutter-sm": "0.75rem",
            "space-md": "1rem",
            "space-xl": "2.5rem"
          },
          "fontFamily": {
            "body-lg": ["Inter", "sans-serif"],
            "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
            "body-sm": ["Inter", "sans-serif"],
            "label-md": ["JetBrains Mono", "monospace"],
            "headline-md": ["Plus Jakarta Sans", "sans-serif"],
            "label-lg": ["JetBrains Mono", "monospace"],
            "headline-xl": ["Plus Jakarta Sans", "sans-serif"],
            "label-sm": ["JetBrains Mono", "monospace"],
            "body-md": ["Inter", "sans-serif"],
            "headline-sm": ["Plus Jakarta Sans", "sans-serif"],
            "handwriting": ["Caveat", "cursive"]
          },
          "fontSize": {
            "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.015em", "fontWeight": "600" }],
            "body-sm": ["12px", { "lineHeight": "18px", "fontWeight": "400" }],
            "label-md": ["11px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
            "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
            "label-lg": ["13px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }],
            "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.04em", "fontWeight": "600" }],
            "body-md": ["14px", { "lineHeight": "21px", "fontWeight": "400" }],
            "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }]
          }
        }
      }
    };
  </script>

  <style>
    /* Infinite Dot Matrix Pattern */
    .bg-dot-matrix {
      background-color: #fbf8fc;
      background-image: radial-gradient(rgba(113, 116, 136, 0.16) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }
    
    /* Tactile Workbench Card Shadows */
    .card-shadow {
      box-shadow: 0px 1px 3px rgba(46, 59, 82, 0.05), 0px 10px 28px -6px rgba(46, 59, 82, 0.07);
    }
    .card-shadow-active {
      box-shadow: 0px 0px 0px 1.5px rgba(99, 85, 216, 0.25), 0px 14px 34px -6px rgba(99, 85, 216, 0.12), 0px 4px 12px rgba(46, 59, 82, 0.04);
    }
    
    /* Glassmorphic Rim Accents */
    .glass-dock {
      box-shadow: 0px 16px 36px -8px rgba(46, 59, 82, 0.12), 0px 4px 12px -2px rgba(46, 59, 82, 0.06), inset 0px 1px 0px rgba(255, 255, 255, 0.9);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.03);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(46, 59, 82, 0.2);
      border-radius: 9999px;
    }
  </style>

  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-dot-matrix text-on-surface font-body-md select-none overflow-hidden min-h-screen relative w-full h-full">

  <!-- ================= TOP FLOATING NAVIGATION BAR ================= -->
  <nav class="fixed top-4 left-1/2 -translate-x-1/2 w-[calc(100%-3rem)] max-w-7xl z-50 flex items-center justify-between px-4 py-2.5 rounded-full bg-surface-container-lowest/70 dark:bg-inverse-surface/70 backdrop-blur-md shadow-xl ring-1 ring-white/60 dark:ring-white/10 transition-all">
    <!-- Left Section: Logo & Search -->
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 pr-2">
        <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-on-primary shadow-sm shadow-primary/30">
          <span class="material-symbols-outlined text-[19px]">cloud</span>
        </div>
        <span class="text-headline-md font-headline-md font-bold text-on-surface dark:text-inverse-on-surface tracking-tight">Kumo</span>
      </div>
      <!-- Quick Command Search Pill -->
      <div class="hidden lg:flex items-center gap-2.5 bg-surface-container-low/90 hover:bg-surface-container-high/60 transition-colors px-3.5 py-1.5 rounded-full border border-outline-variant/30 text-secondary cursor-pointer" id="command-bar">
        <span class="material-symbols-outlined text-[17px] text-secondary">search</span>
        <span class="font-body-sm text-body-sm text-secondary">Ask Kumo or command...</span>
        <span class="font-label-sm text-label-sm bg-surface-container-lowest px-1.5 py-0.5 rounded shadow-sm border border-outline-variant/40 text-on-surface-variant font-semibold">⌘K</span>
      </div>
    </div>

    <!-- Center Navigation Links -->
    <div class="hidden md:flex items-center gap-1 bg-surface-container/50 p-1 rounded-full border border-outline-variant/20">
      <button class="nav-filter-btn text-primary dark:text-inverse-primary bg-primary-fixed dark:bg-primary-container font-semibold rounded-full px-3 py-1.5 transition-all text-label-md font-label-md flex items-center gap-1.5 active:scale-95" data-filter="all">
        <span class="material-symbols-outlined text-[16px]">apps</span>
        All Tools
      </button>
      <button class="nav-filter-btn text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface rounded-full px-3 py-1.5 transition-all text-label-md font-label-md flex items-center gap-1.5 hover:bg-surface-container-high/60 active:scale-95" data-filter="launcher">
        <span class="material-symbols-outlined text-[16px]">settings_suggest</span>
        System
      </button>
      <button class="nav-filter-btn text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface rounded-full px-3 py-1.5 transition-all text-label-md font-label-md flex items-center gap-1.5 hover:bg-surface-container-high/60 active:scale-95" data-filter="writer">
        <span class="material-symbols-outlined text-[16px]">edit_note</span>
        Writing
      </button>
      <button class="nav-filter-btn text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface rounded-full px-3 py-1.5 transition-all text-label-md font-label-md flex items-center gap-1.5 hover:bg-surface-container-high/60 active:scale-95" data-filter="code">
        <span class="material-symbols-outlined text-[16px]">code</span>
        Code
      </button>
      <button class="nav-filter-btn text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface rounded-full px-3 py-1.5 transition-all text-label-md font-label-md flex items-center gap-1.5 hover:bg-surface-container-high/60 active:scale-95" data-filter="design">
        <span class="material-symbols-outlined text-[16px]">palette</span>
        Design
      </button>
      <button class="nav-filter-btn text-secondary dark:text-secondary-fixed hover:text-on-surface dark:hover:text-inverse-on-surface rounded-full px-3 py-1.5 transition-all text-label-md font-label-md flex items-center gap-1.5 hover:bg-surface-container-high/60 active:scale-95" data-filter="notes">
        <span class="material-symbols-outlined text-[16px]">sticky_note_2</span>
        Notes
      </button>
    </div>

    <!-- Right Trailing Actions -->
    <div class="flex items-center gap-2">
      <!-- Trailing Icon: Notifications -->
      <button class="relative w-9 h-9 rounded-full flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container-high/60 transition-colors active:scale-95">
        <span class="material-symbols-outlined text-[20px]">notifications</span>
        <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-primary ring-2 ring-white"></span>
      </button>
      <!-- Trailing Icon: Settings -->
      <button class="w-9 h-9 rounded-full flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container-high/60 transition-colors active:scale-95">
        <span class="material-symbols-outlined text-[20px]">settings</span>
      </button>
      <!-- User Avatar / Profile -->
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-primary to-purple-400 text-white font-label-sm text-label-sm font-bold flex items-center justify-center shadow-xs ring-1 ring-white/60 hover:ring-primary transition-all cursor-pointer" title="User Profile">
        KM
      </div>
      <!-- Primary Action: + New Tool -->
      <button class="flex items-center gap-1.5 bg-primary hover:bg-primary-container text-on-primary font-semibold text-label-md font-label-md px-3.5 py-2 rounded-full shadow-md shadow-primary/25 hover:shadow-lg transition-all active:scale-95 ml-1 cursor-pointer" id="btn-add-tool">
        <span class="material-symbols-outlined text-[18px]">add</span>
        <span>+ New Tool</span>
      </button>
    </div>
  </nav>

  <!-- ================= CANVAS WORKBENCH AREA ================= -->
  <main class="stage fixed inset-0 overflow-hidden cursor-default select-none" id="canvas-viewport">
    <div class="world absolute left-0 top-0 will-change-transform" id="canvas-stage"></div>
  </main>

  <!-- ================= FLOATING BOTTOM FOOTER & SHORTCUT HUD ================= -->
  <footer class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 flex items-center gap-4 px-5 py-2 rounded-full bg-surface-container-lowest/80 dark:bg-inverse-surface/80 backdrop-blur-md shadow-lg ring-1 ring-white/60 dark:ring-white/10 text-secondary">
    <!-- Canvas Zoom Controls -->
    <div class="flex items-center gap-1 font-label-md text-label-md">
      <button class="w-7 h-7 rounded-lg flex items-center justify-center hover:text-on-surface hover:bg-surface-container-high/50 transition-colors active:scale-95 cursor-pointer" id="btn-zoom-out" title="Zoom Out">
        <span class="material-symbols-outlined text-[16px]">zoom_out</span>
      </button>
      <span class="px-2 text-primary dark:text-inverse-primary font-medium text-body-sm font-body-sm select-none" id="zoom-display">100%</span>
      <button class="w-7 h-7 rounded-lg flex items-center justify-center hover:text-on-surface hover:bg-surface-container-high/50 transition-colors active:scale-95 cursor-pointer" id="btn-zoom-in" title="Zoom In">
        <span class="material-symbols-outlined text-[16px]">zoom_in</span>
      </button>
      <button class="w-7 h-7 rounded-lg flex items-center justify-center hover:text-on-surface hover:bg-surface-container-high/50 transition-colors active:scale-95 ml-0.5 cursor-pointer" id="btn-zoom-fit" title="Fit Screen">
        <span class="material-symbols-outlined text-[16px]">fit_screen</span>
      </button>
    </div>
    <!-- Divider -->
    <div class="w-px h-4 bg-outline-variant/40"></div>
    <!-- Helpful Canvas Interaction Keys -->
    <div class="hidden sm:flex items-center gap-3 font-body-sm text-body-sm text-slate-500">
      <span class="flex items-center gap-1.5">
        <kbd class="px-1.5 py-0.5 bg-surface-container-lowest rounded shadow-2xs border border-outline-variant/30 text-[10px] font-label-sm font-semibold text-slate-700">Space</kbd>
        pan
      </span>
      <span>•</span>
      <span class="flex items-center gap-1.5">
        <kbd class="px-1.5 py-0.5 bg-surface-container-lowest rounded shadow-2xs border border-outline-variant/30 text-[10px] font-label-sm font-semibold text-slate-700">Ctrl+Scroll</kbd>
        zoom
      </span>
      <span>•</span>
      <span class="flex items-center gap-1.5">
        <kbd class="px-1.5 py-0.5 bg-surface-container-lowest rounded shadow-2xs border border-outline-variant/30 text-[10px] font-label-sm font-semibold text-slate-700">Ctrl+K</kbd>
        quick command
      </span>
    </div>
  </footer>

  <!-- ================= RADAR MINI-MAP (BOTTOM RIGHT VIEWPORT) ================= -->
  <aside class="fixed bottom-6 right-6 hidden xl:flex flex-col p-2.5 rounded-2xl bg-surface-container-lowest/85 backdrop-blur-md border border-white/80 shadow-lg z-30 w-36 gap-1.5 pointer-events-auto">
    <div class="flex items-center justify-between text-[10px] font-label-sm text-slate-500 font-semibold px-0.5">
      <span>MINI CANVAS</span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
    </div>
    <!-- Dynamic visual radar box representing active workspace cards -->
    <div id="radar-minimap-container" class="relative w-full h-20 bg-slate-100/90 rounded-lg border border-slate-200/60 overflow-hidden p-1.5">
      <div id="radar-cards-layer" class="absolute inset-0 pointer-events-none"></div>
      <!-- Active Viewport Viewfinder rectangle -->
      <div id="radar-viewfinder" class="absolute inset-1.5 border-1.5 border-primary rounded pointer-events-none bg-primary/5"></div>
    </div>
  </aside>

  <!-- ================= COMMAND PALETTE MODAL (Ctrl+K) ================= -->
  <div class="modal-backdrop hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-start justify-center pt-24" id="cmd-modal">
    <div class="cmd-modal-card w-full max-w-xl bg-surface-container-lowest rounded-2xl shadow-2xl border border-slate-200 p-4 flex flex-col gap-3">
      <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
        <span class="material-symbols-outlined text-primary text-[20px]">sparkles</span>
        <input type="text" id="cmd-modal-input" class="w-full bg-transparent border-none outline-none font-body-md text-slate-800 placeholder-slate-400" placeholder="Type a command or ask Kumo anything..." autocomplete="off">
        <button class="text-[11px] font-label-sm font-semibold bg-slate-100 text-slate-500 px-2 py-0.5 rounded border border-slate-200 cursor-pointer" id="cmd-modal-close">ESC</button>
      </div>
      <div class="flex flex-col gap-1.5">
        <span class="text-[11px] font-label-sm uppercase tracking-wider font-semibold text-slate-400">Quick Assistant Commands</span>
        <div class="flex flex-wrap gap-1.5">
          <button class="cmd-chip text-[12px] font-body-sm bg-slate-50 hover:bg-primary/10 hover:text-primary text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 transition-colors cursor-pointer" data-cmd="open spotify">Launch Spotify</button>
          <button class="cmd-chip text-[12px] font-body-sm bg-slate-50 hover:bg-primary/10 hover:text-primary text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 transition-colors cursor-pointer" data-cmd="open code">Open VS Code</button>
          <button class="cmd-chip text-[12px] font-body-sm bg-slate-50 hover:bg-primary/10 hover:text-primary text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 transition-colors cursor-pointer" data-cmd="open browser">Open Chrome</button>
          <button class="cmd-chip text-[12px] font-body-sm bg-slate-50 hover:bg-primary/10 hover:text-primary text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 transition-colors cursor-pointer" data-cmd="search desktop for files">Search Desktop</button>
          <button class="cmd-chip text-[12px] font-body-sm bg-slate-50 hover:bg-primary/10 hover:text-primary text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 transition-colors cursor-pointer" data-cmd="draft email to client">Draft Client Update</button>
          <button class="cmd-chip text-[12px] font-body-sm bg-slate-50 hover:bg-primary/10 hover:text-primary text-slate-700 px-2.5 py-1 rounded-full border border-slate-200 transition-colors cursor-pointer" data-cmd="write python backup script">Backup Script</button>
        </div>
      </div>
      <div class="cmd-modal-response hidden p-3 bg-slate-50 rounded-xl border border-slate-200 text-body-sm text-slate-700 max-h-48 overflow-y-auto" id="cmd-response"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Native Bridge & Application Logic -->
  <script src="bridge.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
