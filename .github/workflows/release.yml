name: Release Kumo Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release Windows Binaries
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests Gate
        run: npm run test:unit

      - name: Run E2E Tests Gate
        run: npm run test:e2e
        env:
          CI: true

      - name: Build Windows Executables (NSIS Installer + Portable + Update Blockmaps)
        run: npm run dist:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Notes from Tag Annotation
        id: release_meta
        shell: bash
        run: |
          git fetch --tags --force
          NOTES=$(git tag -l --format='%(contents)' ${{ github.ref_name }})
          if [ -n "$NOTES" ]; then
            printf "%s\n" "$NOTES" > extracted_notes.md
            TITLE=$(head -n 1 extracted_notes.md | sed 's/^# *//')
          elif [ -f RELEASE_TEMPLATE.md ]; then
            TITLE="Kumo ${{ github.ref_name }}"
            sed "s/__VERSION__/${{ github.ref_name }}/g" RELEASE_TEMPLATE.md > extracted_notes.md
          else
            TITLE="Kumo ${{ github.ref_name }}"
            echo "Release ${{ github.ref_name }}" > extracted_notes.md
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.title }}
          body_path: extracted_notes.md
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: false
