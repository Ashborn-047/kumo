name: Release Kumo Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release Windows Binaries
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests Gate
        run: npm run test:unit

      - name: Run E2E Tests Gate
        run: npm run test:e2e
        env:
          CI: true

      - name: Build Windows Executables (NSIS Installer + Portable + Update Blockmaps)
        run: npm run dist:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Release Title from Notes
        id: release_meta
        shell: bash
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            TITLE=$(head -n 1 RELEASE_NOTES.md | sed 's/^# *//')
            echo "title=$TITLE" >> $GITHUB_OUTPUT
          else
            echo "title=Kumo ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release_meta.outputs.title }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: false
