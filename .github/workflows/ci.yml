name: CI Test Suites

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-unit-test:
    name: Lint & Unit Test Suite
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax
        run: |
          node -c src/main.js src/preload.js src/actions.js src/ai.js src/intent-router.js src/system-scanner.js src/settings.js src/overlay-manager.js src/board-manager.js src/studio-manager.js src/tray.js

      - name: Run Infrastructure Unit Tests
        run: npm run test:unit

  test-e2e:
    name: Playwright Electron E2E Suite
    runs-on: windows-latest
    needs: validate-and-unit-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E Test Suite
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/report/
            test-results/
          retention-days: 14
